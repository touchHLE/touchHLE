[project]
name = "hyperhle-fix-bot"
version = "0.1.0"
description = "Telegram bot for requesting app fixes in HyperHLE — collects IPA links, log files and a bug description, opens a GitHub issue, and forwards the request to a maintainer."
requires-python = ">=3.10"
dependencies = [
    # job-queue extra (APScheduler) powers the 15-minute conversation timeout.
    "python-telegram-bot[job-queue]>=21.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["bot"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
