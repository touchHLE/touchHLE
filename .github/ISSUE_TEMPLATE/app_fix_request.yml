name: Request an app fix (IPA + logs)
description: Request that a specific app/game be fixed in HyperHLE. Requires an IPA link, a log file, and a description of the bug/crash.
labels: ["app fix request"]
body:
  - type: markdown
    attributes:
      value: |
        Use this form to request that a specific app or game be fixed in
        HyperHLE. This is the same request the Telegram bot files on your behalf.

        **Three things are required** for a fix to be investigated:
        1. A direct **IPA link** (or zipped `.app`) so the app can be downloaded and run.
        2. A **log file** from the run that shows the failure.
        3. A clear **description of the bug/crash**.

        Please make sure you are testing against the **latest HyperHLE build from
        [Actions](https://github.com/HyperHLE/HyperHLE/actions)** (or the latest
        [release](https://github.com/HyperHLE/HyperHLE/releases)) before filing.

        Before opening a request, please search
        [existing issues](https://github.com/HyperHLE/HyperHLE/issues) to avoid
        duplicates.
  - type: input
    attributes:
      label: App / game name
      placeholder: Angry Birds
    validations:
      required: true
  - type: input
    attributes:
      label: App version
      description: The version of the app/game (as shown in its Info.plist or App Store metadata).
      placeholder: '1.0'
    validations:
      required: false
  - type: textarea
    attributes:
      label: IPA link(s)
      description: |
        Direct download link(s) to the `.ipa` (or zipped `.app`). One link per
        line. These must be direct links the build can download — not a page you
        have to click through.
      placeholder: |
        https://example.com/app.ipa
    validations:
      required: true
  - type: input
    attributes:
      label: HyperHLE version tested (latest from Actions)
      description: |
        The version or commit of the latest HyperHLE build from
        https://github.com/HyperHLE/HyperHLE/actions that you tested against.
      placeholder: 'v1.0.2 / commit abcdef0'
    validations:
      required: true
  - type: input
    attributes:
      label: Operating system
      placeholder: Windows 11 / Android 14 / macOS 14
    validations:
      required: false
  - type: input
    attributes:
      label: GPU
      placeholder: NVIDIA GTX 1660 / Adreno 740 / Apple M2
    validations:
      required: false
  - type: textarea
    attributes:
      label: Describe the bug / crash
      description: |
        What did you do, what did you expect, and what actually happened? Where
        does it fail (boot, menu, level load, gameplay)? Show the crash if you can.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Log file(s)
      description: |
        Paste the relevant log output here, especially around the moment the bug
        occurs. On Android this is `log.txt`; on Windows/macOS/Linux it is the
        Terminal / Command Prompt / PowerShell output. You can also drag-and-drop
        a log file into this field.
      render: 'text'
    validations:
      required: true
  - type: textarea
    attributes:
      label: Screenshots or video (optional)
      description: Drag and drop images or short videos that show the problem.
    validations:
      required: false
  - type: checkboxes
    attributes:
      label: By submitting this issue, I certify that…
      options:
        - label: I have searched existing issues and this is not a duplicate.
          required: true
        - label: I tested against the latest HyperHLE build from Actions / the latest release.
          required: true
        - label: I legally own the app / game I am asking about.
          required: true
        - label: I understand that linking to, discussing or asking for pirated content is not permitted, and will lead to an immediate ban.
          required: true
        - label: I understand that fixes are best-effort and there is no guarantee that this specific app will be made to work.
          required: true
